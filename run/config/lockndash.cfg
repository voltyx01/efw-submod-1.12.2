# Configuration file

dash {
    #  [default: false]
    B:"Allow Dash In Water"=false

    # Reset the cooldown for hitting while dashing [default: false]
    B:"Cooldown Attack Penalty"=false

    # Default cooldown ticks after a dash [range: 0 ~ 1000, default: 20]
    I:"Dash Cooldown"=20

    # Number of particles spawned during dash [range: 0 ~ 100, default: 15]
    I:"Dash Particle Count"=15

    # Height offset of dash particles [range: 0.0 ~ 10.0, default: 0.1]
    S:"Dash Particle Height"=0.1

    # Speed of dash particles [range: 0.0 ~ 10.0, default: 0.05]
    S:"Dash Particle Speed"=0.05

    # Spread of dash particles [range: 0.0 ~ 10.0, default: 0.3]
    S:"Dash Particle Spread"=0.3

    # Y offset for particle spawn position [range: 0.0 ~ 10.0, default: 0.1]
    S:"Dash Particle Y Offset"=0.1

    # Post-dash invulnerability duration in ticks [range: 0 ~ 100, default: 10]
    I:"Dash Post Timer Ticks"=10

    # Resistance effect duration in ticks during dash [range: 0 ~ 200, default: 10]
    I:"Dash Resistance Duration"=10

    # Resistance effect level during dash (0 = I) [range: 0 ~ 255, default: 2]
    I:"Dash Resistance Level"=2

    # Pitch of dash sound [range: 0.0 ~ 5.0, default: 1.0]
    S:"Dash Sound Pitch"=1.0

    # Volume of dash sound [range: 0.0 ~ 5.0, default: 1.0]
    S:"Dash Sound Volume"=1.0

    # Speed multiplier applied during dash [range: 0.0 ~ 10.0, default: 1.0]
    S:"Dash Speed"=1.3

    # Stamina cost per dash [range: 0.0 ~ 100.0, default: 5.0]
    S:"Dash Stamina Cost"=0.0

    # Delay before stamina starts regenerating after dash [range: 0 ~ 200, default: 20]
    I:"Dash Stamina Regen Delay"=20

    # Weakness effect duration in ticks during dash [range: 0 ~ 200, default: 10]
    I:"Dash Weakness Duration"=10

    # Weakness effect level during dash (0 = I) [range: 0 ~ 255, default: 255]
    I:"Dash Weakness Level"=255

    # Stamina penalty for hitting while dashing [range: 0 ~ 100, default: 0]
    I:"Stamina Attack Penalty"=0
}


overlay {
    # X offset of the dash cooldown bar from the screen center [range: -5000 ~ 5000, default: 0]
    I:"Dash Bar Base X"=0

    # Y offset of the dash cooldown bar from the screen center [range: -5000 ~ 5000, default: 0]
    I:"Dash Bar Base Y"=0

    # X offset of the stamina bar from the right edge of the screen [range: -5000 ~ 5000, default: 0]
    I:"Overlay Base X"=0

    # Y offset of the stamina bar from the bottom edge of the screen [range: -5000 ~ 5000, default: 0]
    I:"Overlay Base Y"=0

    #  [default: false]
    B:"Use Alternative Stamina HUD"=false
}


stamina {
    # Multiplier for stamina drain attacking: weaponCooldown * Multiplier [range: 0.0 ~ 10.0, default: 0.5]
    S:"Attack Stamina Multiplier"=0.5

    #  [range: 0 ~ 100, default: 0]
    I:"Jump Regen Interval Normal"=0

    #  [default: true]
    B:"Limit By Food Level"=true

    # Maximum stamina value [range: 1 ~ 1000, default: 20]
    I:"Max Stamina"=20

    #  [range: 0 ~ 100, default: 4]
    I:"Regen Interval Boost"=4

    #  [range: 0 ~ 100, default: 6]
    I:"Regen Interval Normal"=6

    # Multiplier for stamina drain when blocking: damage * (maxStamina/20) * Multiplier [range: 0.0 ~ 10.0, default: 0.5]
    S:"Shield Stamina Multiplier"=0.5

    #  [range: 0 ~ 200, default: 25]
    I:"Sprint Drain Interval"=99

    #  [range: 0 ~ 200, default: 0]
    I:"Sprint Jump Cost"=0

    #  [range: 0 ~ 200, default: 20]
    I:"Sprint Regen Delay"=20

    #  [range: 0 ~ 10, default: 1]
    I:"Stamina Drain Amount"=1

    #  [range: 0 ~ 10, default: 1]
    I:"Stamina Regen Amount"=1
}


stamina_effects {
    # Mining fatigue amplifier [range: 0 ~ 10, default: 0]
    I:"Fatigue Amplifier"=0

    # Mining fatigue duration in ticks [range: 1 ~ 200, default: 10]
    I:"Fatigue Duration"=10

    # Slowness effect amplifier [range: 0 ~ 10, default: 2]
    I:"Slowness Amplifier"=2

    # Slowness effect duration in ticks [range: 1 ~ 200, default: 10]
    I:"Slowness Duration"=10

    # Weakness effect amplifier [range: 0 ~ 10, default: 0]
    I:"Weakness Amplifier"=0

    # Weakness effect duration in ticks [range: 1 ~ 200, default: 10]
    I:"Weakness Duration"=10
}


