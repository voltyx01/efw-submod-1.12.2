# Configuration file

extragore {

    ceiling {
        # List of block registry names which can or cannot interact with the ceiling. If blockListMode (Block List Mode) is NONE, the list won't be considered.
        # Examples include minecraft:stone, minecraft:concrete and modid:your_block.
        S:blockList <
         >

        # Controls how blockList (Block List) is applied. NONE the list is not applied. BLACKLIST excludes listed blocks. WHITELIST allows only listed blocks.
        # Valid values:
        # NONE
        # BLACKLIST
        # WHITELIST
        S:blockListMode=NONE

        # If true, some blood styles can stick to the ceiling surfaces.
        B:stick=true
    }

    fade {
        # Controls when alpha fading starts. 0.0 fades from the initial spawn. 1.0 never fades.
        # Min: 0.0
        # Max: 1.0
        D:startFade=0.15
    }

    health_scale {
        # If true, blood particle size on hit is reduced on healthier entities and ramps toward full size as health gets lower.
        B:enableSizeReduction=false

        # Health fraction where the size ramp ends. At or below this value, sizeAtLow is used.
        # Min: 0.0
        # Max: 1.0
        D:endHealthFraction=0.3

        # Blood size multiplier used at or below endHealthFraction.
        # Min: 0.0
        # Max: 5.0
        D:sizeAtLow=1.0

        # Blood size multiplier used at or above startHealthFraction. Lower values make healthier targets spawn smaller blood particles.
        # Min: 0.0
        # Max: 5.0
        D:sizeAtStart=0.2

        # Health fraction where the size ramp starts. At or above this value, sizeAtStart is used.
        # Min: 0.0
        # Max: 1.0
        D:startHealthFraction=0.8
    }

    damage_sources {
        # If true, blood can spawn from cactus damage.
        B:cactus=false

        # If true, blood can spawn from drowning damage.
        B:drowning=false

        # If true, blood can spawn from effect based damage such as magic, wither, dragon breath and starvation.
        B:effects=false

        # If true, blood can spawn from fall like damage such as fall impact, fly into wall, anvils and falling blocks.
        B:fall=false

        # If true, blood can spawn from fire, lava and hot floor damage.
        B:fire=false

        # If true, blood can spawn from lightning damage.
        B:lightning=false

        # If true, blood can spawn from suffocation damage.
        B:suffocation=false

        # If true, blood can spawn from void damage.
        B:void=false
    }

    hit_dispersion {
        # Horizontal cone width multiplier for directional blood spray. Lower values tighten the cone. Higher values widen it.
        # Min: 0.0
        # Max: 5.0
        D:coneRange=2.0

        # Fixed amount of blood particles to spawn per hit. Set to 0 to use dynamic count.
        # Min: 0
        # Max: 500
        I:fixedCount=10

        # Force multiplier for directional blood spray velocity and vertical kick. Lower values soften the hit. Higher values throw particles further.
        # Min: 0.0
        # Max: 5.0
        D:force=0.7

        # Vertical cone width multiplier for directional blood spray. Lower values flatten the splash arc. Higher values widen the vertical dispersion.
        # Min: 0.0
        # Max: 5.0
        D:yConeRange=3.0
    }

    ground {
        # If true, blood on top surfaces can merge into larger puddles.
        B:amalgamation=true

        # Maximum size for ground and ceiling spread.
        # Min: 0.0
        # Max: 5.0
        D:spreadMax=1.25

        # Minimum size for ground and ceiling spread.
        # Min: 0.0
        # Max: 5.0
        D:spreadMin=0.85
    }

    wall {
        # List of block registry names which can or cannot attach to the wall. If blockListMode (Block List Mode) is NONE, the list won't be considered.
        # Examples include minecraft:glass, minecraft:ice and modid:your_block.
        S:blockList <
         >

        # Controls how blockList (Block List) is applied. NONE the list is not applied. BLACKLIST excludes listed blocks. WHITELIST allows only listed blocks.
        # Valid values:
        # NONE
        # BLACKLIST
        # WHITELIST
        S:blockListMode=NONE

        # If true, blood particles on the wall can drip.
        B:drip=true

        # Slide speed over the wall per ticks. Set to 0.0 to disable sliding.
        # Min: 0.0
        # Max: 0.05
        D:slideSpeed=0.003

        # Maximum length for wall stretch.
        # Min: 0.0
        # Max: 5.0
        D:stretchMax=1.35

        # Minimum length for wall stretch.
        # Min: 0.0
        # Max: 5.0
        D:stretchMin=0.75
    }

    hot_blocks {
        # List of block registry names treated as hot.
        # Examples include minecraft:magma, minecraft:lit_furnace, minecraft:lava and minecraft:flowing_lava.
        S:blockList <
            minecraft:magma
         >

        # If true, hot blocks, listed in the blockList (Block List), will make the blood particle behave as if they were over the lava surface.
        B:hotBlocks=true
    }

}


