# Configuration file

entities {
    # How much health should soldiers have?
    D:soldierHealth=2.0

    # How much should soldiers spawn?
    D:soldierSpawn=0.00

    # What equipment should the terrorists have?
    S:terroristEquipmentConfiguration=m4a1:1.0:M4A1Mag_2, m16a1:1.0:M4A1Mag_2, Remington870:1.0

    # How much health should terrorists have?
    D:terroristHealth=1.0

    # How much should terrorists spawn?
    D:terroristSpawn=0.0
}


gameplay {
    B:ammoCounterBackgroundReverse=false
    D:ammoCounterSize=0.5
    I:ammoCounterX=0
    I:ammoCounterY=0
    I:ammunitionCounterOffsetX=0
    I:ammunitionCounterOffsetY=0
    D:ammunitionCounterSize=0.5

    # Should glass blocks be breakable by bullets?
    B:bulletBreakGlass=true

    # Enables the ammo counter
    B:enableAmmoCounter=true

    # Enables the black background on the ammo counter.
    B:enableAmmoCounterBackground=true

    # Should players bleed when hit?
    D:enableBleedingOnHit=0.0

    # Should blur be applied when aiming?
    B:enableBlurOnAim=false

    # Enables muzzle effects.
    B:enableMuzzleEffects=false

    # Enable open door key display when hovering doors
    B:enableOpenDoorDisplay=true
    B:enableStatusMessages=false

    # What should the block drop chance be?
    D:explodedBlockDropChance=1.0

    # Should the explosion break blocks?
    B:explosionBreak=false

    # How much damage explosions should deal.
    D:explosionDamage=10.0

    # If true, hold to aim. If false, toggle to aim.
    B:holdToAim=true

    # A list of blocks that will be penetrable by bullets.
    S:penetrableBlocks=minecraft:glass, minecraft:glass_pane, minecraft:stained_glass, minecraft:stained_glass_pane

    # Where should the status bar be located?
    S:statusBarPosition=BOTTOM_RIGHT
}


gunplay {
    # Milliseconds to cut off from the beginning of the drawing animation
    I:drawAnimationCutoffMs=150

    # Camera sway speed (frequency) when drawing a weapon
    D:drawCameraSwayFrequency=0.3

    # Camera sway smoothness (length in seconds) when drawing a weapon
    D:drawCameraSwayLength=0.75

    # Camera sway force (trauma) when drawing a weapon
    D:drawCameraSwayTrauma=0.6

    # Milliseconds to delay the draw sound after switching weapons (can be negative to play earlier)
    I:drawSoundDelay=-200
    I:drawSoundOffsetMs=250

    # Multiplier for the speed of drawing a weapon (e.g. 1.5 = 50% faster)
    D:drawSpeedMultiplier=1.4

    # Global multiplier for weapon recoil on the X axis (yaw)
    D:globalRecoilMultiplierX=0.2

    # Global multiplier for weapon recoil on the Y axis (pitch)
    D:globalRecoilMultiplierY=0.2

    # Global multiplier for weapon spread (inaccuracy) when aiming
    D:globalSpreadMultiplierAim=0.5

    # Global multiplier for weapon spread (inaccuracy) when hip-firing
    D:globalSpreadMultiplierHip=0.5

    # Global multiplier for reload animation speed (e.g. 1.3 = 30% faster)
    D:reloadSpeedMultiplier=1.3

    # Milliseconds to cut off from the end of the unequipping animation
    I:unequipAnimationCutoffMs=70

    # Camera sway speed (frequency) when unequipping a weapon
    D:unequipCameraSwayFrequency=0.3

    # Camera sway smoothness (length in seconds) when unequipping a weapon
    D:unequipCameraSwayLength=0.75

    # Camera sway force (trauma) when unequipping a weapon
    D:unequipCameraSwayTrauma=0.6

    # How much to translate pistols downwards during the unequip animation
    D:unequipPistolLowerAmount=0.0

    # The curve exponent for pistol unequipping downward movement. >1 means it accelerates.
    D:unequipPistolLowerSpeed=0.0

    # Multiplier for the speed of unequipping a weapon (e.g. 1.5 = 50% faster)
    D:unequipSpeedMultiplier=1.4

    # If true, the camera will drop downwards (directional sway) instead of shaking (trauma sway) during draw/unequip
    B:useDirectionalCameraSway=false
}


ores {
    # Spawns per chunk for copper ore.
    I:copperSpawnsPerChunk=24

    # Spawns per chunk for graphite ore.
    I:graphiteSpawnsPerChunk=16

    # Spawns per chunk for lead ore.
    I:leadSpawnsPerChunk=32

    # Spawns per chunk for sulfur ore.
    I:sulfurSpawnsPerChunk=24

    # Spawns per chunk for tin ore.
    I:tinSpawnsPerChunk=32
}


rendering {
    # Setting this to false disables all shaders, enabling allows to select which shaders are used.
    B:enableAllShaders=true

    # Enables bullet hole decals on hit blocks
    B:enableBulletHoles=true

    # Enables the fancy MWC snow/rain
    B:enableFancyRainAndSnow=false

    # Enables flash shaders
    B:enableFlashShaders=false

    # Enables gun shaders, so skinning & lighting
    B:enableGunShaders=false

    # Enables the HDR framebuffer, requires restart. The HDR is the cause of a lot of shader incompat
    B:enableHDRFramebuffer=true

    # Enables reticle shaders
    B:enableReticleShaders=false

    # Enables scope effects
    B:enableScopeEffects=true

    # Enables scope vignette
    B:enableScopeVignette=false

    # Setting this to false disables all screen shaders, enabling allows to select which screen shaders are used.
    B:enableScreenShaders=false

    # Setting this to false disables all world shaders, enabling allows to select which world shaders are used.
    B:enableWorldShaders=false

    screenshaders {
        # Enables glow around bright objects (bloom)
        B:bloomEffect=false

        # Lower numbers = better performance
        I:bloomLayers=2

        # Enables film grain effect
        B:filmGrain=false

        # Configures the intensity of the film grain effect
        D:filmGrainIntensity=0.03

        # Enable on-screen rain/snow VFX
        B:onScreenRainAndSnow=false
    }

}


